### Site Settings ###
title               : Insights4YOU
description         : >-
                      “Iluminando caminhos para soluções mais inteligentes”
                      Porque cada insight pode ser o ponto de partida para sua próxima grande ideia

baseurl             : ""                                          # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
remote_theme        : marciopaiva/insights4you-jekyll-theme        # GitHub Pages builds via remote_theme, not via the published gem
repository          : marciopaiva/marciopaiva.github.io            # NWO used by jekyll-github-metadata
lang                : "pt-BR"
keywords            : "arquitetura de soluções, devops, cloud, inteligência artificial, rust, tauri"


### Theme Settings ###
themeColor          : "#206bc4"
useIconfont         : false
layout-dark         : false


### Plugins ###
plugins:
  - jekyll-remote-theme
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-github-metadata


### Navbar Settings ###
nav_exclude:                        # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md


### Author Info ###
author:
  name              : Marcio Paiva Barbosa
  bio               : Arquiteto de Soluções
  image             : https://avatars.githubusercontent.com/u/1004306?v=4
  email             : mpaivabarbosa@gmail.com
  github            : marciopaiva
  github-sponsor    : marciopaiva
  linkedin          : marcio-paiva-barbosa


### Posts ###
permalink: /blog/:title


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name


### Comments (Giscus - https://giscus.app) ###
# 1. Habilite "Discussions" neste repositório no GitHub.
# 2. Instale o app do giscus: https://github.com/apps/giscus
# 3. Pegue repo_id/category_id em https://giscus.app e preencha abaixo.
giscus:
  enabled: false
  repo: "marciopaiva/marciopaiva.github.io"
  repo_id: ""
  category: "Comments"
  category_id: ""
  mapping: "pathname"


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      layout-wrapper-full: true
      comments: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "default"


### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
  - vendor/
  - .bundle/
